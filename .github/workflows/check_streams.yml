name: Live Stream Health Check (Peak & Off-Peak)

on:
  schedule:
    # Peak Pattaya Nightlife (18:00 - 04:00 ICT = 11:00 - 21:00 UTC): Run every 10 minutes
    - cron: '*/10 11-21 * * *'
    # Daytime & Morning Off-Peak (04:00 - 18:00 ICT = 21:00 - 11:00 UTC): Run every 30 minutes
    - cron: '*/30 0-10,22-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Stream Health Checker
        run: node scripts/check_streams.mjs

      - name: Commit and Push Status Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/stream_status.json public/data/venues.json public/data/live_cams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): auto-update stream status manifest" && git push)
