name: Creator VOD Pipeline & Stream Health

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Zero-Quota Creator VOD Scraper
        run: node scripts/fetch_creator_vods.mjs

      - name: Run Stream Health Checker
        run: node scripts/check_streams.mjs

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/creator_videos.json data/creator_videos.json public/data/stream_status.json public/data/venues.json public/data/live_cams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pipeline): auto-update creator VODs & stream status" && git push)
