name: Creator VOD Pipeline & Stream Health

on:
  schedule:
    # Peak hours: every 15 min, 14:00–03:00 ICT (= 07:00–19:59 UTC)
    - cron: '*/15 7-19 * * *'
    # Off-peak: every 30 min, 03:00–14:00 ICT (= 20:00–06:59 UTC, split across midnight)
    - cron: '*/30 20-23 * * *'
    - cron: '*/30 0-6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Zero-Quota Creator VOD Scraper
        run: node scripts/fetch_creator_vods.mjs

      - name: Run Stream Health Checker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/check_streams.mjs

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/creator_videos.json data/creator_videos.json public/data/stream_status.json public/data/venues.json public/data/live_cams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(pipeline): auto-update creator VODs & stream status" && (git push || (git pull --rebase origin main && git push)))
